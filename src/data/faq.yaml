# Questions fréquentes affichées sur /faq et la page d'accueil.
# Les variables entre doubles accolades (ex. {{prices.cours_collectifs.trimestre}})
# sont automatiquement résolues depuis prices.yaml, contact.yaml et venues.yaml.

debuter-parler-chinois:
  category: "Débuter la calligraphie"
  question: "Faut-il parler ou comprendre le chinois pour pratiquer la calligraphie ?"
  answer: "Non, aucune connaissance préalable du chinois n’est nécessaire. La
    calligraphie chinoise est avant tout un art du geste, de la respiration et
    de l’espace. Vous apprendrez progressivement à reconnaître et tracer les
    sinogrammes, des pictogrammes archaïques aux caractères complets, sans avoir
    besoin de parler la langue."
  order: 1
  show_on_home: true
  home_question: "Faut-il parler chinois pour commencer ?"
  home_answer: "Non. Aucune connaissance préalable du chinois n’est nécessaire."

debuter-cours-debutants:
  category: "Débuter la calligraphie"
  question: "Les cours collectifs hebdomadaires sont-ils ouverts aux grands débutants ?"
  answer: "Absolument. Les cours accueillent tous les niveaux, des néophytes
    complets aux pratiquants confirmés. Chaque élève progresse à son propre
    rythme grâce à l’accompagnement individualisé de Christophe Desmur au sein
    du petit groupe (2 à 8 participants)."
  order: 2
  show_on_home: true
  home_question: "Les débutants sont-ils acceptés ?"
  home_answer: "Oui, les ateliers accueillent les débutants comme les pratiquants
    plus expérimentés."

debuter-materiel-fourni:
  category: "Débuter la calligraphie"
  question: "Quel matériel faut-il apporter lors des cours ?"
  answer: "Tout le matériel nécessaire est intégralement mis à votre disposition
    sur place : pinceaux en poils naturels, bâtons d’encre de Chine
    traditionnelle, pierres à encre et papiers de riz absorbants. Vous venez
    simplement dans une tenue confortable, sans aucun achat préalable."
  order: 3
  show_on_home: true
  home_question: "Le matériel est-il fourni ?"
  home_answer: "Oui, le matériel nécessaire est fourni pendant les ateliers."

debuter-seance-essai:
  category: "Débuter la calligraphie"
  question: "Comment se déroule une première séance d’essai ?"
  answer: "Vous pouvez réserver une séance d’essai sans engagement sur le créneau
    du lundi soir au Dojo Zen ou du mercredi matin chez Miroirs du Ciel. Vous
    découvrirez la tenue verticale du pinceau, la préparation de l’encre à la
    pierre et le tracé de vos premiers traits fondamentaux."
  order: 4

lieux-horaires-cours-lyon:
  category: "Lieux, Horaires & Tarifs à Lyon"
  question: "Où et quand ont lieu les cours réguliers de calligraphie à Lyon ?"
  answer: "Les cours se déroulent dans le 4e arrondissement de Lyon (Croix-Rousse)
    sur deux créneaux hebdomadaires : les lundis soirs de 18h30 à 20h30 au Dojo
    Zen de Lyon (11, rue Dumenge) et les mercredis matins de 10h à 12h à la
    boutique Miroirs du Ciel (9, rue de Belfort)."
  order: 1
  show_on_home: true
  home_question: "Où ont lieu les ateliers ?"
  home_answer: "À Lyon, notamment au dojo zen de Lyon et à la boutique Miroirs du Ciel."

tarifs-cours-collectifs-particuliers:
  category: "Lieux, Horaires & Tarifs à Lyon"
  question: "Quels sont les tarifs des cours collectifs et particuliers ?"
  answer: "Les cours collectifs réguliers sont à
    {{prices.cours_collectifs.trimestre}} € par trimestre pour
    {{prices.cours_collectifs.seances}} cours (matériel inclus, sans crédit
    d’impôt). Les cours particuliers à domicile sont à
    {{prices.cours_individuel_domicile.ttc_heure}} € TTC / heure et bénéficient
    d’un crédit d’impôt de
    {{prices.cours_individuel_domicile.reduction_impot_pct}} % (agrément Coop A
    Dom n° {{contact.coop_a_dom_agrement}}), soit
    {{prices.cours_individuel_domicile.net_heure}} € net de l’heure."
  order: 2

cours-particuliers-domicile-lyon:
  category: "Lieux, Horaires & Tarifs à Lyon"
  question: "Proposez-vous des cours particuliers à domicile à Lyon ?"
  answer: "Oui, Christophe Desmur se déplace à votre domicile sur Lyon et
    l’ensemble de la métropole lyonnaise avec tout le matériel nécessaire. Les
    horaires et la fréquence sont entièrement flexibles selon vos
    disponibilités."
  order: 3

difference-calligraphie-chinoise-shodo:
  category: "Pratique, Styles & Culture"
  question: "Quelle est la différence entre la calligraphie chinoise et le shodō
    japonais ?"
  answer: "La calligraphie chinoise (shūfǎ 書法) est la tradition originelle,
    pratiquée depuis plus de 3 000 ans en Chine. Le shodō japonais en est
    directement issu et partage les mêmes outils (pinceau, encre de Chine,
    pierre, papier). À Lyon, Christophe Desmur enseigne la tradition classique
    chinoise et les styles majeurs des grandes dynasties Tang et Song."
  order: 1

styles-calligraphiques-abordes:
  category: "Pratique, Styles & Culture"
  question: "Quels styles calligraphiques sont abordés au cours des séances ?"
  answer: "L’apprentissage débute généralement par le style régulier (Kaishu 楷书),
    qui pose la structure géométrique et l’équilibre des traits. Les pratiquants
    explorent ensuite le style courant (Xingshu 行书, plus fluide) et le style
    cursif (Caoshu 草书), selon leur rythme et leurs affinités."
  order: 2

age-pratiquer-calligraphie-chinoise:
  category: "Interventions pour groupes & structures"
  question: "À partir de quel âge peut-on pratiquer la calligraphie chinoise ?"
  answer: "La calligraphie s’adresse à tous les âges : enfants dès l’école
    primaire (à partir de 6 ans, avec initiation au Sumi-e et aux pictogrammes),
    collégiens et lycéens, adultes de tous âges, et seniors en maisons de
    retraite et EHPAD."
  order: 1

organiser-atelier-scolaire-etablissement:
  category: "Interventions pour groupes & structures"
  question: "Comment organiser un atelier en école, collège, lycée ou université ?"
  answer: "Christophe Desmur se déplace directement dans votre établissement
    scolaire à Lyon et dans la région avec tout le matériel pour la classe. Le
    format varie de 1 h à 3 h par session
    ({{prices.interventions.ht_heure_standard}} € HT/h). Une prise de contact
    préalable permet de caler le projet pédagogique."
  order: 2

ateliers-comites-entreprise-residences-seniors:
  category: "Interventions pour groupes & structures"
  question: "Proposez-vous des ateliers pour les comités d’entreprise et les
    résidences seniors ?"
  answer: "Oui. En entreprise, des ateliers d'1 h à 3 h sont organisés sur la
    pause méridienne ou lors de séminaires. En maison de retraite et EHPAD, des
    ateliers calmes stimulent la motricité fine et la créativité des résidents."
  order: 3

acquerir-calligraphie-originale:
  category: "Œuvres à vendre & Acquisition"
  question: "Comment acquérir une calligraphie originale ?"
  answer: "Les calligraphies originales proposées à la vente sont des pièces
    uniques disponibles à l’acquisition. L’acquisition se fait directement
    auprès du calligraphe, sans intermédiaire ni paiement automatisé en ligne :
    contactez simplement Christophe Desmur pour échanger sur l’œuvre, connaître
    le prix, convenir d’une remise en main propre à Lyon ou d’une expédition
    soignée."
  order: 1

demander-calligraphie-personnalisee:
  category: "Œuvres à vendre & Acquisition"
  question: "Peut-on demander une calligraphie personnalisée sur mesure ?"
  answer: "Tout à fait. Christophe Desmur réalise régulièrement des commandes
    personnalisées : caractère symbolique, prénom transcrit phonétiquement,
    poème chinois classique ou devise philosophique."
  order: 2
