# Témoignages affichés dans la section "Témoignages & retours d'expérience"
# de /le-calligraphe (sous-section 4.1 de "Témoignages & références").
pascale-france:
  quote: "Depuis 2023, je me lance en calligraphie cursive avec Christophe Desmur pour pratiquer la danse du pinceau !"
  author: "Pascale France"
  role: "Artiste peintre et formatrice en lavis traditionnel et Sumi-e"
  source: "Encre Paisible"
  href: "https://www.encrepaisible.com/parcours-artistique"
  badge: "Artiste peintre"
  linkText: "Voir le parcours"
ovpar-villeurbanne:
  quote: "Christophe Desmur anime chaque vendredi matin l’atelier de calligraphie : un temps précieux d’attention, de motricité fine et de sérénité partagé avec nos adhérents seniors depuis plus de dix ans."
  author: "OVPAR Villeurbanne"
  role: "Office villeurbannais des personnes âgées et des retraités"
  source: "Programme annuel"
  href: "https://ovpar.fr/wp-content/uploads/2024/08/Ateliers-annuels-0VPAR.pdf"
  badge: "Partenaire depuis 2012"
  linkText: "Voir la publication"
dojo-zen-de-lyon:
  quote: "Une pratique attentive de la calligraphie guidée par la présence, la posture juste et la respiration, fidèle à l’esprit de la tradition martiale et méditative."
  author: "Dojo Zen de Lyon"
  role: "Espace de pratique traditionnelle · Lyon 4e (Croix-Rousse)"
  source: "Cours réguliers"
  href: "https://arts-martiaux-lyon.fr/calligraphie/"
  badge: "Cours hebdomadaires"
  linkText: "Voir la publication"
centre-national-de-la-danse:
  quote: "Rencontres « Corps, Conscience, Cosmos » : un dialogue vivant et une recherche croisée entre danse contemporaine, physique fondamentale et geste calligraphique traditionnel avec Vânia Vaneau et le CNRS."
  author: "Centre National de la Danse (CN D Lyon)"
  role: "Institution culturelle nationale · Lyon"
  source: "Agenda CN D"
  href: "https://www.cnd.fr/fr/agenda/corps-conscience-et-cosmos"
  badge: "Institution culturelle"
  linkText: "Voir la publication"
  date: "2022-02-05"
le-progres:
  quote: "Christophe Desmur a présenté l’art de la calligraphie lors d’une rencontre culturelle à Lissieu, initiant le public à la rigueur du tracé, au souffle et à l’esthétique des caractères chinois traditionnels."
  author: "Le Progrès"
  role: "Article de presse · Lissieu (Rhône)"
  source: "Le Progrès"
  href: "https://www.leprogres.fr/rhone/2010/11/21/lissieu-christophe-desmur-un-moine-zen-a-presente-l-art-de-la-calligraphie"
  badge: "Presse"
  linkText: "Lire l’article"
  date: "2010-11-21"
